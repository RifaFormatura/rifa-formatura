<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d7195b">
<title>Rifa de Formatura — Escolha seu número</title>
<style>
  :root{
    --pink:#d7195b; --pink2:#f22970; --soft:#fff3f7; --ink:#111;
    --gold:#d49a16; --line:#e8b7c9; --green:#18a57a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 10% 10%, rgba(215,25,91,.08), transparent 25%),
      radial-gradient(circle at 90% 30%, rgba(212,154,22,.08), transparent 25%),
      #fff7fa;
  }
  .wrap{max-width:1050px;margin:auto;padding:18px}
  header{
    text-align:center;padding:28px 16px 20px;
    background:linear-gradient(135deg,#fff,#ffeaf2);
    border:2px solid #f3c3d2;border-radius:24px;
    box-shadow:0 8px 28px rgba(130,20,60,.08);
  }
  .cap-row{display:flex;align-items:center;justify-content:center;gap:12px}.cap-row>span{font-size:32px}
  .mini{font-weight:800;letter-spacing:3px;color:#111;font-size:clamp(18px,4vw,30px)}
  h1{margin:2px 0 4px;font-size:clamp(42px,9vw,82px);line-height:.95;
     color:var(--pink);font-style:italic;font-family:"Brush Script MT","Segoe Script",cursive}
  .sub{font-size:clamp(14px,2.4vw,20px);font-weight:700}
  .banner{
    margin:18px auto 0;max-width:800px;background:#111;color:white;
    border-radius:14px;padding:14px 18px;font-weight:800
  }
  .banner b{color:#ff3c7e}
  .card{
    margin-top:18px;background:white;border:2px solid #f0b9cc;border-radius:22px;
    padding:16px;box-shadow:0 8px 28px rgba(130,20,60,.07)
  }
  .section-title{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin:-3px auto 15px;max-width:700px;background:var(--pink);color:#fff;
    padding:11px 18px;border-radius:12px;font-size:clamp(20px,4vw,30px);font-weight:900
  }
  .grid{display:grid;grid-template-columns:repeat(10,1fr);border:1px solid var(--line)}
  .num{
    min-height:58px;border:0.5px solid var(--line);background:#fff;
    font-size:clamp(15px,2.6vw,22px);font-weight:800;cursor:pointer;transition:.15s;
  }
  .num:hover{background:#ffe3ed;transform:scale(1.02)}
  .num.selected{background:var(--pink);color:#fff}
  .num.sold{background:#ddd;color:#999;text-decoration:line-through;cursor:not-allowed}
  .num.sold:hover{transform:none;background:#ddd}
  .legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:13px}
  .dot{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .price{background:#111;color:white;border-radius:16px;padding:18px;text-align:center;font-size:18px;font-weight:800}
  .price strong{color:#fff;font-size:34px;display:block}
  .pixbox{background:#fff;border:2px solid #d7195b;border-radius:16px;padding:18px}
  .pixbox h2{margin:0 0 8px;color:var(--pink);font-size:20px}
  .pix-code{
    width:100%;min-height:92px;resize:none;border:1px solid #ddd;border-radius:10px;
    padding:10px;font-size:12px;background:#fafafa
  }
  button.whatsapp{width:100%;border:0;border-radius:12px;background:#20a463;color:white;padding:13px 16px;font-size:17px;font-weight:900;cursor:pointer;margin-top:10px}
  button.whatsapp:hover{background:#168a52}
  button.primary{
    width:100%;border:0;border-radius:12px;background:var(--pink);color:white;
    padding:13px 16px;font-size:17px;font-weight:900;cursor:pointer;margin-top:10px
  }
  button.primary:hover{background:#b9134d}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .step{padding:15px;background:#fff0f5;border-radius:14px;border:1px solid #f2c0d1;text-align:center}
  .step b{display:block;color:var(--pink);font-size:20px;margin-bottom:5px}
  .draw{margin-top:14px;background:#111;color:#fff;border-radius:16px;padding:18px;text-align:center}
  .draw strong{color:#ff3c7e;font-size:26px}
  footer{text-align:center;padding:24px 10px;color:#555;font-size:14px}
  .modal{
    position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;
    justify-content:center;padding:18px;z-index:10
  }
  .modal.open{display:flex}
  .modal-card{max-width:520px;width:100%;background:white;border-radius:22px;padding:22px}
  .modal-card h2{margin-top:0;color:var(--pink)}
  .chosen{font-size:32px;font-weight:900;text-align:center;margin:5px 0 14px}
  .close{float:right;border:0;background:none;font-size:28px;cursor:pointer}
  .note{font-size:13px;color:#666;line-height:1.4}
  @media(max-width:700px){
    .grid{grid-template-columns:repeat(5,1fr)}
    .num{min-height:55px}
    .actions,.steps{grid-template-columns:1fr}
  }
.admin{margin-top:18px;background:#111;color:#fff;border-radius:22px;padding:18px}.admin h2{margin:0 0 10px;color:#ff4a86}.admin-controls{display:flex;gap:10px;flex-wrap:wrap}.admin-controls input[...]
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="cap-row"><span>🎓</span><div class="mini">RIFA DE</div><span>🎓</span></div>
  <h1>Formatura</h1>
  <div class="sub">Sua ajuda me aproxima de um sonho! 💗</div>
  <div class="banner">Estou realizando esta rifa para arrecadar recursos para custear as <b>fotos da minha formatura</b>.</div>
</header>

<section class="card">
  <div class="section-title">🎓 ♡ ESCOLHA SEU NÚMERO! ♡ 🎓</div>
  <div id="grid" class="grid" aria-label="Números da rifa"></div>
  <div class="legend">
    <span><i class="dot" style="background:#fff;border:1px solid #e8b7c9"></i>Disponível</span>
    <span><i class="dot" style="background:#d7195b"></i>Selecionado</span>
    <span><i class="dot" style="background:#ddd"></i>Indisponível</span>
  </div>
</section>

<section class="actions">
  <div class="price">Cada número:<strong>R$ 10,00</strong></div>
  <div class="pixbox">
    <h2>💗 PIX — copie e pague</h2>
    <div id="selectedText">Escolha um número acima.</div>
    <textarea id="pix" class="pix-code" readonly>00020126580014BR.GOV.BCB.PIX0136c5f6950f-5421-45a9-a016-cde466719bfc520400005303986540510.005802BR5923Jeciane Moraes de Souza6009SAO PAULO62140510[...]
    <button class="primary" id="copyBtn">📋 Copiar PIX copia e cola</button><button class="whatsapp" id="whatsMainBtn">💬 Avisar pelo WhatsApp</button>
    <p class="note">Depois de copiar, abra o aplicativo do seu banco, escolha PIX → Copiar e Colar e confirme o pagamento de R$ 10,00.</p>
  </div>
</section>

<section class="card">
  <div class="section-title">COMO FUNCIONA?</div>
  <div class="steps">
    <div class="step"><b>1. Escolha</b>Selecione um número disponível de 00 a 99.</div>
    <div class="step"><b>2. Pague</b>Copie o PIX e faça o pagamento de R$ 10,00.</div>
    <div class="step"><b>3. Concorra</b>Seu número participa do sorteio conforme a regra abaixo.</div>
  </div>
  <div class="draw">
    <div>SORTEIO</div>
    <strong>11/10 (DOMINGO)</strong>
    <div>Baseado no <b>1º prêmio da Loteria Federal</b>, usando os <b>dois últimos números</b>.</div>
  </div>
</section>

<section class="admin"><h2>🔐 Painel da administradora</h2><div id="adminLogin"><p>Entre com sua senha para administrar os números.</p><div class="admin-controls"><input id="adminPassword" typ[...]
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <button class="close" id="close">×</button>
    <h2>Número escolhido 💗</h2>
    <div class="chosen" id="chosen"></div>
    <p>Agora copie o PIX abaixo e faça o pagamento de <b>R$ 10,00</b>.</p>
    <textarea id="modalPix" class="pix-code" readonly>00020126580014BR.GOV.BCB.PIX0136c5f6950f-5421-45a9-a016-cde466719bfc520400005303986540510.005802BR5923Jeciane Moraes de Souza6009SAO PAULO621[...]
    <button class="primary" id="modalCopy">📋 Copiar PIX copia e cola</button><button class="whatsapp" id="whatsBtn">💬 Avisar pelo WhatsApp</button>
    <p class="note">Importante: esta página é uma interface de escolha. Para impedir que duas pessoas escolham o mesmo número em celulares diferentes, é necessário conectar a página a um ba[...]
  </div>
</div>

<script>
const pixCode = document.getElementById('pix').value;
const grid = document.getElementById('grid');
const modal = document.getElementById('modal');
const chosen = document.getElementById('chosen');
const selectedText = document.getElementById('selectedText');
const selected = new Set();

for(let i=0;i<100;i++){
  const n=String(i).padStart(2,'0');
  const b=document.createElement('button');
  b.className='num';
  b.textContent=n;
  b.type='button';
  b.addEventListener('click',()=>{
    if(b.classList.contains('sold')) return;
    selected.clear();
    document.querySelectorAll('.num.selected').forEach(x=>x.classList.remove('selected'));
    selected.add(n);
    b.classList.add('selected');
    chosen.textContent='Nº '+n;
    selectedText.innerHTML='Você escolheu o <b>número '+n+'</b>.';
    modal.classList.add('open');
  });
  grid.appendChild(b);
}

async function copyPix(){
  try{
    await navigator.clipboard.writeText(pixCode);
    alert('PIX copia e cola copiado! Agora abra o app do seu banco e faça o pagamento de R$ 10,00.');
  }catch(e){
    const ta=document.createElement('textarea'); ta.value=pixCode; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    alert('PIX copiado! Agora abra o app do seu banco.');
  }
}
const whatsappNumber='5591988866082'; function openWhatsApp(){ const number=selected.size?[...selected][0]:null; if(!number){alert('Primeiro escolha um número da rifa.');return;} const message=`[...]
document.getElementById('copyBtn').onclick=copyPix;
document.getElementById('modalCopy').onclick=copyPix; document.getElementById('whatsBtn').onclick=openWhatsApp; document.getElementById('whatsMainBtn').onclick=openWhatsApp;
document.getElementById('close').onclick=()=>modal.classList.remove('open');
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
const ADMIN_PASSWORD='394062'; const paidKey='rifa_paid_numbers'; function getPaid(){try{return new Set(JSON.parse(localStorage.getItem(paidKey)||'[]'))}catch(e){return new Set()}} function savePai[...]
</script>
</body>
</html>
